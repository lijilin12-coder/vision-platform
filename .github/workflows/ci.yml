name: CI

# 每次推送和每个 PR：在 Windows 和 Linux 上编译并运行全部测试。
# macOS 不在这里构建：日常开发就在 Mac 上进行，而且 macOS 构建机在私有仓库中按 10 倍计费。

on:
  push:
    branches: [main]   # 分支上的推送由 pull_request 触发，避免同一次推送构建两遍
    paths-ignore: ["docs/**/*.md", "*.md"]
  pull_request:
    paths-ignore: ["docs/**/*.md", "*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # 正常 10 分钟左右；软件包缓存还没有建起来、软件源又慢的那一次需要很久
    steps:
      - uses: actions/checkout@v4
      # 构建机用的软件源有时很慢（2026-11-24：每秒三百多 KB，OpenCV 的依赖有上百个包，光下载就超过了任务的时限）。
      # 所以把下载好的软件包（.deb 文件）缓存起来：软件包的清单不变，以后的构建就不用再下载。
      - name: 恢复软件包缓存
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-24.04-${{ hashFiles('.github/apt-packages.txt') }}
      - name: 安装依赖
        run: |
          mkdir -p ~/apt-archives/partial
          # 一个包 20 秒没有动静就放弃、换下一个源重试，而不是一直等到整个任务超时
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get $APT update -q
          sudo apt-get $APT install -y -q $(grep -v '^#' .github/apt-packages.txt)
          # apt 是以 root 的身份写这些文件的；改回来，缓存才存得进去
          sudo chown -R "$USER" ~/apt-archives
      - name: 配置
        run: cmake --preset default
      - name: 编译
        run: cmake --build --preset default
      - name: 测试
        run: ctest --preset default
      - name: 编译并运行教程示例（内存检查、线程检查）
        run: CXX=g++ bash docs/tutorial/cpp/run_all.sh
      - name: 编译并运行推理教程示例
        run: CXX=g++ bash docs/tutorial/inference/run_all.sh

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: 准备 vcpkg 二进制缓存目录
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
      - name: 恢复 vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-cache
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-md-
      - name: 安装 Ninja
        run: choco install ninja -y --no-progress
      - name: 设置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 指定使用 C:\vcpkg
        # “设置 MSVC 环境”会把 VCPKG_ROOT 改成 Visual Studio 自带的 vcpkg，这里改回来
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"
      - name: 配置（首次会编译 OpenCV，较慢）
        run: cmake --preset windows
      - name: 编译
        run: cmake --build --preset windows
      - name: 测试
        run: ctest --preset windows
      - name: 命令行冒烟测试（含中文目录）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\数据目录"
          $images = "$env:RUNNER_TEMP\示例图像"
          & $cli --data $data sample-images $images; Check
          $rid = (& $cli --data $data recipe build samples\recipes\bright-spot.draft.json | Select-Object -Last 1).Trim(); Check
          $vid = (& $cli --data $data recipe publish $rid | Select-Object -Last 1).Trim(); Check
          $out = & $cli --data $data inspect $vid $images
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out -match "OK 2.+NG 2.+ERROR 0")) {
            # 失败时把能找到的线索都打印出来：退出码、方案和版本的编号、日志、崩溃报告
            Write-Host "inspect 的退出码：$code；输出 $(@($out).Count) 行；rid=[$rid] vid=[$vid]"
            Get-ChildItem -Recurse $data | ForEach-Object { Write-Host $_.FullName $_.Length }
            Get-ChildItem "$data\logs" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 -Encoding utf8 }
            Get-ChildItem "$data\crashes" -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Encoding utf8 }
            throw "检测结果与预期不符"
          }
      - name: 热切换压力测试（POC-9：一边检测，一边部署和回滚）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          function Last($lines) { return ($lines | Select-Object -Last 1).Trim() }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\热切换数据"
          $images = "$env:RUNNER_TEMP\示例图像"
          $r1 = Last (& $cli --data $data recipe build samples\recipes\bright-spot.draft.json); Check
          $v1 = Last (& $cli --data $data recipe publish $r1); Check
          $r2 = Last (& $cli --data $data recipe build samples\recipes\bright-spot.draft.json); Check
          & $cli --data $data recipe set-param $r2 n5 maxCount 5; Check
          $v2 = Last (& $cli --data $data recipe publish $r2); Check
          $a = Last (& $cli --data $data release create $v1); Check
          $b = Last (& $cli --data $data release create $v2); Check
          $station = Last (& $cli --data $data station create 工位一); Check
          # 这里是调试版本，数字只用来看趋势；检查项（没有丢失、没有用错上线包）才是重点
          & $cli --data $data station stress $station $a $b $images --count 3000 --deploys 12 --rollbacks 3; Check
      - name: 方案助手（POC-11：按工作流搭出候选方案并自动调参）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\助手数据"
          $golden = "$env:RUNNER_TEMP\基准图集"
          & $cli --data $data workflow import samples\workflows\bright-spot.json; Check
          & $cli --data $data golden sample $golden; Check
          & $cli --data $data assist run "$golden\brief.json" --script samples\assistant\bright-spot.script.json; Check
          $session = ((& $cli --data $data assist list) | Select-Object -Last 1).Trim(); Check
          $stored = Get-Content "$data\assist-sessions\$session.json" -Raw -Encoding utf8 | ConvertFrom-Json
          # 示例里盲测集的光照比调参集暗：调参集上必须达标，越界的提议必须被拒绝，报告必须指出盲测集上变差了
          if ($stored.endReason -ne "criteria-met") { throw "候选方案没有在调参集上达标" }
          if ($stored.report.rejected -ne 3) { throw "脚本里 3 份越界的提议没有全部被拒绝" }
          if (-not $stored.report.overfitSuspected) { throw "报告没有指出候选方案只适应了调参集" }
          if ($stored.report.blind.misses -lt 1) { throw "盲测集上应该有漏检" }
          & $cli --data $data assist abandon $session; Check
          # 搜索顾问：没有人告诉它答案，它必须自己把调参集调到达标
          & $cli --data $data assist run "$golden\brief.json" --advisor search; Check
          $latest = Get-ChildItem "$data\assist-sessions" -Filter *.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $found = Get-Content $latest.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if ($found.advisor -notlike "search:*") { throw "最新的会话不是搜索顾问的" }
          if ($found.endReason -ne "criteria-met") { throw "搜索顾问没有把候选方案调到达标" }
          # 另一类任务：宽度测量（卡尺 + 范围判定）。搜索顾问必须把它调到调参集和盲测集都达标
          & $cli --data $data workflow import samples\workflows\width-measure.json; Check
          & $cli --data $data golden sample "$env:RUNNER_TEMP\宽度图集" --scenario width --blind-lighting same; Check
          & $cli --data $data assist run "$env:RUNNER_TEMP\宽度图集\brief.json" --advisor search; Check
          $latest = Get-ChildItem "$data\assist-sessions" -Filter *.json | Where-Object { $_.Name -notlike "*.llm.json" } | Sort-Object LastWriteTime | Select-Object -Last 1
          $width = Get-Content $latest.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if ($width.workflow.id -ne "width-measure") { throw "最新的会话不是宽度测量的" }
          if ($width.endReason -ne "criteria-met") { throw "宽度测量没有调到达标" }
          if (-not $width.report.blind.meetsCriteria) { throw "宽度测量在盲测集上没有达标" }
          # 带定位的工作流：任务书里带着匹配模板，零件的位置和角度随机。必须调到调参集和盲测集都达标
          & $cli --data $data workflow import samples\workflows\locate-width-measure.json; Check
          & $cli --data $data golden sample "$env:RUNNER_TEMP\定位图集" --scenario locate --blind-lighting same; Check
          & $cli --data $data assist run "$env:RUNNER_TEMP\定位图集\brief.json" --advisor search; Check
          $latest = Get-ChildItem "$data\assist-sessions" -Filter *.json | Where-Object { $_.Name -notlike "*.llm.json" } | Sort-Object LastWriteTime | Select-Object -Last 1
          $locate = Get-Content $latest.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          if ($locate.workflow.id -ne "locate-width-measure") { throw "最新的会话不是带定位的工作流的" }
          if ($locate.endReason -ne "criteria-met") { throw "带定位的工作流没有调到达标" }
          if (-not $locate.report.blind.meetsCriteria) { throw "带定位的工作流在盲测集上没有达标" }
          if ($locate.brief.templates.Count -ne 1) { throw "会话记录里应该有任务书给的 1 个模板" }
      - name: 匹配模板（中文数据目录下的内容仓库）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          function Last($lines) { return ($lines | Select-Object -Last 1).Trim() }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\模板数据"
          $images = "$env:RUNNER_TEMP\模板样图"
          & $cli --data $data sample-images $images; Check
          $recipe = Last (& $cli --data $data recipe new 模板试用); Check
          $template = Last (& $cli --data $data recipe template add $recipe 零件一角 "$images\ok_01.png" 120 90 64 64); Check
          if ($template -ne "t1") { throw "模板 ID 应该是 t1，实际是 $template" }
          # 内容按哈希存成了一个文件；同一块再框一次，不会多出文件
          & $cli --data $data recipe template add $recipe 同一块 "$images\ok_01.png" 120 90 64 64; Check
          $files = @(Get-ChildItem "$data\content" -Recurse -File)
          if ($files.Count -ne 1) { throw "内容仓库里应该只有 1 个文件，实际有 $($files.Count) 个" }
          # 伸出样图的框必须被拒绝
          & $cli --data $data recipe template add $recipe 出界 "$images\ok_01.png" 600 90 64 64
          if ($LASTEXITCODE -eq 0) { throw "伸出样图的模板没有被拒绝" }
          & $cli --data $data recipe show $recipe; Check
      - name: 样本、数据集和规则 N1（留作基准的图像不能用于训练）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          function Last($lines) { return ($lines | Select-Object -Last 1).Trim() }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\样本数据"
          $images = "$env:RUNNER_TEMP\样本图像"
          & $cli --data $data sample-images $images; Check
          & $cli --data $data sample import $images --label ok; Check
          # 同一个文件换个中文名字再导入：还是同一个样本，样本总数不变
          Copy-Item "$images\ok_01.png" "$images\换了个名字.png"
          & $cli --data $data sample import "$images\换了个名字.png"; Check
          $count = @(Get-ChildItem "$data\samples" -Filter *.json).Count
          if ($count -ne 4) { throw "应该有 4 个样本，实际有 $count 个" }
          # 冻结成数据集版本（用于训练）之后，这些图像不能再放进基准图集
          $dataset = Last (& $cli --data $data dataset new 训练用); Check
          & $cli --data $data dataset add $dataset --all-unassigned; Check
          $version = Last (& $cli --data $data dataset freeze $dataset); Check
          & $cli --data $data dataset show $version; Check
          $before = @(Get-ChildItem "$data\golden-sets" -Filter *.json -ErrorAction SilentlyContinue).Count
          # golden sample 自己生成新的图像，和训练用的不重复：必须成功
          & $cli --data $data golden sample "$env:RUNNER_TEMP\样本基准"; Check
          $after = @(Get-ChildItem "$data\golden-sets" -Filter *.json).Count
          if ($after -ne $before + 1) { throw "基准图集没有建出来" }
          # 练习训练用的合成图像（中文目录）；没有配置训练服务时，训练任务照样记录下来，状态是“已失败”
          $generated = "$env:RUNNER_TEMP\合成图像"
          & $cli --data $data sample generate $generated --ok 10 --ng 3; Check
          if (@(Get-ChildItem "$generated\ok" -Filter *.png).Count -ne 10) { throw "合格的图像数量不对" }
          if (@(Get-ChildItem "$generated\ng" -Filter *.png).Count -ne 3) { throw "不合格的图像数量不对" }
          & $cli --data $data sample import "$generated\ok" --label ok; Check
          $dataset2 = Last (& $cli --data $data dataset new 合成); Check
          & $cli --data $data dataset add $dataset2 --all-unassigned; Check
          $version2 = Last (& $cli --data $data dataset freeze $dataset2); Check
          & $cli --data $data train submit $version2 --name 试一试
          if ($LASTEXITCODE -eq 0) { throw "没有训练服务时，提交训练应该报告失败" }
          & $cli --data $data train list; Check
          # 训练服务的地址配了、但服务没有启动：同样是记录下来的失败，不是崩溃
          & $cli --data $data --training-url http://127.0.0.1:9 train submit $version2 --name 试一试
          if ($LASTEXITCODE -ne 1) { throw "连不上训练服务时，退出码应该是 1，实际是 $LASTEXITCODE" }
          # 上一条命令按预期以 1 退出；不清零的话，这一步会把它当成自己的结果而失败
          $global:LASTEXITCODE = 0
      - name: 模型在检测引擎里运行（ONNX Runtime）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          function Check { if ($LASTEXITCODE -ne 0) { throw "命令失败，退出码 $LASTEXITCODE" } }
          function Last($lines) { return ($lines | Select-Object -Last 1).Trim().Split(" ")[-1] }
          $cli = ".\build\apps\vision-cli.exe"
          $data = "$env:RUNNER_TEMP\模型数据"
          $images = "$env:RUNNER_TEMP\模型图像"
          & $cli --data $data sample generate $images --ok 10 --ng 6 --seed 7; Check
          # 导入一个事先训练好的模型（和训练服务训练出来的一样，只是这里没有 PyTorch）
          & $cli --data $data model import tests\data\surface-anomaly.onnx --name surface-anomaly --size 256 256 --threshold 0.080625; Check
          $recipe = Last (& $cli --data $data recipe build samples\recipes\surface-anomaly.draft.json); Check
          & $cli --data $data recipe debug $recipe "$images\ok\ok_001.png"; Check
          $version = Last (& $cli --data $data recipe publish $recipe); Check
          # 模型还没有发布：正式检测和创建上线包都必须被拒绝
          & $cli --data $data release create $version
          if ($LASTEXITCODE -eq 0) { throw "用了未发布模型的方案版本不应该能做成上线包" }
          & $cli --data $data model publish surface-anomaly@v1; Check
          $summary = (& $cli --data $data inspect $version "$images\ok" "$images\ng" | Select-Object -Last 1); Check
          Write-Host $summary
          if ($summary -notmatch "OK 10，NG 6，ERROR 0") { throw "检测结果不对：$summary" }
          $release = Last (& $cli --data $data release create $version); Check
          $station = Last (& $cli --data $data station create 模型工位); Check
          & $cli --data $data station deploy $station $release; Check
          $summary = (& $cli --data $data station run $station "$images\ok" "$images\ng" | Select-Object -Last 1); Check
          if ($summary -notmatch "OK 10，NG 6，ERROR 0") { throw "工位的检测结果不对：$summary" }
      - name: 服务（vision-runtime）和 HTTP 接口
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $data = "$env:RUNNER_TEMP\服务数据"
          $server = Start-Process -FilePath ".\build\apps\vision-runtime.exe" -ArgumentList "--data", $data, "--port", "8759" -PassThru -NoNewWindow
          try {
            $base = "http://127.0.0.1:8759/api"
            $up = $false
            foreach ($i in 1..50) {
              try { Invoke-RestMethod "$base/health" | Out-Null; $up = $true; break } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $up) { throw "服务没有启动起来" }
            $operators = (Invoke-RestMethod "$base/operators").operators
            if ($operators.Count -lt 18) { throw "算子目录不完整：只有 $($operators.Count) 个" }
            $body = [System.Text.Encoding]::UTF8.GetBytes('{"name":"接口建的方案"}')
            $recipe = Invoke-RestMethod "$base/recipes" -Method Post -ContentType "application/json" -Body $body
            $added = Invoke-RestMethod "$base/recipes/$($recipe.id)/nodes" -Method Post -ContentType "application/json" -Body '{"operatorId":"vision.to_gray"}'
            if ($added.nodes.Count -ne 1) { throw "加节点之后应该有 1 个节点" }
            # 命令行用同一个数据目录，看得到服务建的方案
            $shown = & .\build\apps\vision-cli.exe --data $data recipe show $recipe.id
            if ($LASTEXITCODE -ne 0) { throw "命令行看不到服务建的方案" }
            Write-Host ($shown -join "`n")
            if (-not (($shown -join "`n") -match "接口建的方案")) { throw "方案的中文名称不对" }
          } finally {
            Stop-Process -Id $server.Id -Force
          }
      - name: 编译并运行教程示例
        shell: cmd
        run: docs\tutorial\cpp\run_all.bat
      - name: 编译并运行推理教程示例
        shell: cmd
        run: docs\tutorial\inference\run_all.bat
